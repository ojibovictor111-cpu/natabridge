services:
  ai:
    build:
      context: ./ai
    container_name: natabridge-ai
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync+restart
          path: ./ai/app
          target: /app/app
        - action: sync+restart
          path: ./ai/models
          target: /app/models
        - action: rebuild
          path: ./ai/requirements.txt
        - action: rebuild
          path: ./ai/Dockerfile

  backend:
    build:
      context: ./backend
    container_name: natabridge-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - ai
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .env
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/pnpm-lock.yaml
        - action: rebuild
          path: ./backend/pnpm-workspace.yaml
        - action: rebuild
          path: ./backend/Dockerfile

  frontend:
    build:
      context: ./frontend
    container_name: natabridge-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .angular/
            - dist/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
        - action: rebuild
          path: ./frontend/Dockerfile
