<section class="dashboard-assessment-page">
  @if (patientId(); as selectedPatientId) {
    <a class="patient-detail-back" [routerLink]="['/dashboard/patients', selectedPatientId]">
      <ng-icon name="lucideArrowLeft" aria-hidden="true" />
      Back to patient record
    </a>
  }

  <nata-assessment-test
    [userAuthenticated]="userAuthenticated()"
    [patientId]="patientId()"
    [patientAge]="patient()?.age ?? null"
    [hasPreviousAssessment]="hasPreviousAssessment()"
  />
</section>
