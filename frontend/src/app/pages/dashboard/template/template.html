<div hlmSidebarWrapper class="dashboard-shell">
  <hlm-sidebar
    class="dashboard-sidebar"
    collapsible="icon"
    variant="sidebar"
    sidebarContainerClass="border-border bg-background"
  >
    <nata-dashboard-nav-bar />
    <button hlmSidebarRail aria-label="Toggle dashboard navigation"></button>
  </hlm-sidebar>

  <main hlmSidebarInset class="dashboard-workspace">
    <header class="flex h-14 shrink-0 items-center justify-between gap-2 border-b px-4">
      <div class="flex items-center gap-2">
        <button
          hlmSidebarTrigger
          srOnlyText="Toggle dashboard navigation"
        ></button>
        <span class="h-4 w-px bg-border" aria-hidden="true"></span>
        <div>
          <p class="m-0 text-xs text-muted-foreground max-md:hidden">Dashboard</p>
          <h1 class="text-sm font-medium">{{ pageTitle() }}</h1>
        </div>
      </div>

      <a routerLink="profile" aria-label="Open profile settings">
        <hlm-avatar>
          <span hlmAvatarFallback>{{ initials() }}</span>
        </hlm-avatar>
      </a>
    </header>

    <div class="dashboard-content">
      <router-outlet />
    </div>
  </main>
</div>

<nata-page-loader />
