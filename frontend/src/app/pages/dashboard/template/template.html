<div class="dashboard-shell" [class.sidebar-open]="isNavBarOpened()">
  <aside class="dashboard-sidebar" id="dashboard-navigation" [class.open]="isNavBarOpened()">
    <nata-dashboard-nav-bar (navClicked)="closeSideBar($event)" />

    <button
      class="sidebar-close"
      type="button"
      aria-label="Close dashboard navigation"
      (click)="closeNavBar()"
    >
      <ng-icon name="hugeMinusSign" aria-hidden="true" />
    </button>
  </aside>

  @if (isNavBarOpened()) {
    <button
      class="sidebar-backdrop"
      type="button"
      aria-label="Close dashboard navigation"
      (click)="closeNavBar()"
    ></button>
  }

  <div class="dashboard-workspace">
    <header class="dashboard-topbar" aria-label="Mobile dashboard header">
      <div class="topbar-context">
        <button
          class="menu-button"
          type="button"
          aria-label="Open dashboard navigation"
          aria-controls="dashboard-navigation"
          [attr.aria-expanded]="isNavBarOpened()"
          (click)="openNavBar()"
        >
          <ng-icon name="hugeMenu02" aria-hidden="true" />
        </button>
        <p>{{ pageTitle() }}</p>
      </div>

      <a class="topbar-avatar" routerLink="profile" aria-label="Open profile settings">JS</a>
    </header>

    <main class="dashboard-content">
      <router-outlet />
    </main>
  </div>
</div>

<nata-page-loader />
