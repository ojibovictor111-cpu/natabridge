<nav class="dashboard-nav" aria-label="Dashboard navigation">
  <a
    class="brand"
    routerLink="."
    (click)="toggleSidebar()"
    aria-label="NataBridge dashboard overview"
  >
    <img src="/logo.webp" alt="natabridge's logo" class="w-[35px]" />
    <span class="brand-copy">
      <strong>NataBridge</strong>
      <small>Maternal Health AI</small>
    </span>
  </a>

  <label class="sidebar-search">
    <span aria-hidden="true">⌕</span>
    <input type="search" placeholder="Search" aria-label="Search dashboard" />
    <kbd>⌘ K</kbd>
  </label>

  <p class="nav-label">Main menu</p>
  <div class="nav-group">
    <a
      class="nav-item"
      routerLink="."
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="toggleSidebar()"
    >
      <ng-icon name="lucideLayoutDashboard" aria-hidden="true" />
      <span>Overview</span>
    </a>
    <a
      class="nav-item"
      routerLink="assessment"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="toggleSidebar()"
    >
      <ng-icon name="lucideClipboardPlus" aria-hidden="true" />
      <span>New assessment</span>
    </a>
    <a class="nav-item" routerLink="patients" routerLinkActive="active" (click)="toggleSidebar()">
      <ng-icon name="lucideUsersRound" aria-hidden="true" />
      <span>Patients</span>
    </a>
    <button class="nav-item" type="button" disabled title="Alerts are coming soon">
      <ng-icon name="lucideBellRing" aria-hidden="true" />
      <span>Alerts</span>
    </button>
  </div>

  <p class="nav-label system-label">Other</p>
  <div class="nav-group">
    <button class="nav-item" type="button" disabled title="Analytics are coming soon">
      <ng-icon name="lucideChartNoAxesCombined" aria-hidden="true" />
      <span>Analytics</span>
    </button>
    <a class="nav-item" routerLink="profile" routerLinkActive="active" (click)="toggleSidebar()">
      <ng-icon name="lucideSettings" aria-hidden="true" />
      <span>Settings</span>
    </a>
  </div>

  <aside class="upgrade-card">
    <p>Get more insights from every patient assessment.</p>
    <a routerLink="profile">✦ Explore features</a>
  </aside>

  <a class="sidebar-profile" routerLink="profile" (click)="toggleSidebar()">
    <span>JS</span><div><strong>Jane Smith</strong><small>Health coordinator</small></div><b>⌄</b>
  </a>

  <button class="nav-item mobile-logout" type="button" (click)="logout()">
    <ng-icon name="hugeLogout01" aria-hidden="true" />
    <span>Log out</span>
  </button>
</nav>
