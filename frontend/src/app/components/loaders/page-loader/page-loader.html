@if (pageLoading()) {
  <div
    class="fixed inset-0 z-100 flex items-center justify-center bg-white/35 backdrop-blur-xs"
    role="status"
    aria-live="polite"
    aria-label="Processing assessment"
  >
    <mat-spinner diameter="44" />
    <span class="sr-only">Processing assessment</span>
  </div>
}
